name: inch_mate
description: "A professional feet-and-inches fraction calculator for contractors, carpenters, woodworkers, and DIY users."
publish_to: 'none'

version: 1.1.5+12

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fraction: ^5.0.3
  gradient_borders: ^1.0.1
  flutter_bloc: ^9.0.0
  lottie: ^3.3.1
  url_launcher: ^6.3.1
  change_app_package_name: ^1.4.0
  flutter_screenutil: ^5.9.3
  auto_size_text: ^3.0.0
  new_version_plus: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/icon/inchmate_icon.png"
  android: true
  ios: true
  remove_alpha_ios: false
  background_color_ios: "transparent"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
